name: Sandbox image

# The sandbox image changes rarely and is ~2.6 GB, so it is not rebuilt on
# every push: only when its Dockerfile changes, on demand, and monthly to pick
# up base image and package security updates (nothing in it is version-pinned).
on:
  push:
    branches: [main]
    paths:
      - sandbox.Dockerfile
      - .github/workflows/sandbox.yml
  workflow_dispatch:
  schedule:
    - cron: "0 4 1 * *"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/owui-codebox-sandbox

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # required to push to ghcr.io via GITHUB_TOKEN

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags & labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest

      # No build cache on purpose: this image alone would fill the 10 GB GitHub
      # Actions cache and evict the server image's layers.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: sandbox.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
