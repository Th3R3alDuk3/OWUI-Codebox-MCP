[project]
name = "owui-codebox-mcp"
version = "0.6.2"
description = "Isolated Python sandboxes for OpenWebUI via MCP."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=4.0.5",
    "httpx2>=2.13.0",
    "microsandbox>=0.7.2",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "rich>=15.0.0",
]

[tool.uv]
allow-insecure-host = []
index = [{ url = "https://pypi.org/simple", default = true }]
